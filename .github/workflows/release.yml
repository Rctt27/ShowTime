name: Release

# Pushing a tag vX.Y.Z on main builds ShowTime for Windows and macOS and publishes both as a GitHub release. The
# Windows zip and the macOS app hold Whisper's native libraries and the transcription model.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # ShowTime.exe and LISEZ-MOI.txt; ffmpeg, Whisper's native libraries, the model and the licences in app.
      - name: Build the folder of the zip
        shell: bash
        run: bash build/package-windows.sh build/ShowTime
      - name: Check that the packaged ShowTime finds ffmpeg and can transcribe
        run: ./build/check-windows-package.ps1 build/ShowTime
      - name: Zip it, named after the version
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path build/ShowTime -DestinationPath "dist/ShowTime-$($env:GITHUB_REF_NAME.TrimStart('v'))-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  # The same build as the CI's macos-app job; keep the workload set and Xcode in step with it.
  macos:
    runs-on: macos-26
    env:
      MACOS_WORKLOAD_SET: 10.0.401
      XCODE: /Applications/Xcode_26.6.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: sudo xcode-select -s "$XCODE"
      - run: dotnet workload install macos --version "$MACOS_WORKLOAD_SET"
      - run: dotnet build src/ShowTime.Mac -c Release
      - name: Add ffmpeg, sign and zip, named after the version
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          # Never an ad hoc release: users would have to grant Screen Recording and Microphone again.
          REQUIRE_SIGNING: 1
        run: bash build/package-macos.sh src/ShowTime.Mac/bin/Release/net10.0-macos/ShowTime.app "dist/ShowTime-${GITHUB_REF_NAME#v}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)" != "$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not match <Version> in Directory.Build.props" >&2
            exit 1
          fi
          # ffmpeg is GPL: each release says where its exact source is.
          ffmpeg_version="$(sed -n 's/^FFMPEG_VERSION=//p' build/fetch-ffmpeg.sh)"
          source_url="https://ffmpeg.org/releases/ffmpeg-$ffmpeg_version.tar.xz"
          echo "Contient ffmpeg $ffmpeg_version (GPL v3) ; code source : $source_url. Voir THIRD-PARTY-NOTICES.md." > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "ShowTime $version" --notes-file notes.md --generate-notes
